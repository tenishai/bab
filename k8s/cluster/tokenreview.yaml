# Applied once by an operator; Gojira binds it to bab's service account
# through `cluster_roles` (its install must list bab-tokenreview as grantable).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bab-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
