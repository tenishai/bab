# OpenFGA, the relationship store bab keeps its tuples and model in. bab
# creates its store and writes its model on first start (fga_boot); this
# Deployment only runs the server. The init container migrates the Postgres
# schema, idempotently, before every start.
#
# openfga-secrets: OPENFGA_DATASTORE_URI (postgres://…) and
# OPENFGA_AUTHN_PRESHARED_KEYS (the value bab-secrets holds as BAB_FGA_TOKEN).
# Pinned by digest: openfga/openfga v1.22.0.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/part-of: bab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openfga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openfga
        app.kubernetes.io/part-of: bab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
          args: [migrate]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
          envFrom:
            - secretRef:
                name: openfga-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      containers:
        - name: openfga
          image: openfga/openfga:v1.22.0@sha256:9cf9a20af32a40434cd3a788c429879439ee9ea9abf65c9c200ee17cd43f769e
          args: [run]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: postgres
            - name: OPENFGA_AUTHN_METHOD
              value: preshared
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_LOG_FORMAT
              value: json
          envFrom:
            - secretRef:
                name: openfga-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: openfga
  labels:
    app.kubernetes.io/name: openfga
    app.kubernetes.io/part-of: bab
spec:
  selector:
    app.kubernetes.io/name: openfga
  ports:
    - name: http
      port: 8080
      targetPort: http
