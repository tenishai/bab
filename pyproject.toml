[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenish-bab"
version = "0.2.0"
description = "bab (باب, door): actor → action → object guardrails for agent fleets, on OpenFGA"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "tenish" }]
dependencies = ["openfga-sdk>=0.9", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]
service = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "PyJWT[crypto]>=2.9"]
postgres = ["psycopg[binary]>=3.1"]
aws = ["botocore>=1.35"]

[project.scripts]
bab = "bab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
