[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenish-bab"
version = "0.1.0"
description = "bab (باب, door): actor → action → object guardrails for agent fleets, on OpenFGA"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["openfga-sdk>=0.9", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
bab = "bab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["bab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
