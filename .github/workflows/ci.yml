name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # spark (arm64, self-hosted) when CI_RUNNER is set. A pull request from a fork
    # always runs on GitHub-hosted ubuntu-latest: a self-hosted runner must never
    # run a fork's code. Defence in depth, not the boundary (a fork's pull_request
    # runs the fork's copy of this file); the real control is fork-PR approval.
    # tests/test_ci_workflow.py keeps every job on this expression.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: rm -rf .venv && python -m venv .venv && .venv/bin/pip install -q -e ".[dev,service,aws]"
      - run: .venv/bin/ruff check bab tests
      - run: make fga
      - name: model is generated from the catalogue, not hand-edited
        run: make model PY=.venv/bin/python && git diff --exit-code model/example.fga
      - run: make test-model PY=.venv/bin/python
      - run: .venv/bin/pytest -q
